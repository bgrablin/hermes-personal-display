<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic Hermes scheduler incident watch preview</title>
  <desc id="desc">The landscape display gives a recent durable scheduler incident an amber notice, while the private inspector retains exact read-only details.</desc>
  <defs>
    <radialGradient id="bg" cx="44%" cy="44%" r="78%"><stop stop-color="#102431"/><stop offset="1" stop-color="#020609"/></radialGradient>
    <linearGradient id="amber" x1="0" x2="1"><stop stop-color="#2d2619"/><stop offset="1" stop-color="#131b20"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <g opacity=".58" fill="#64b7dc"><circle cx="82" cy="118" r="3"/><circle cx="1090" cy="102" r="4"/><circle cx="1034" cy="672" r="3"/><circle cx="144" cy="624" r="3"/><circle cx="302" cy="170" r="2.5"/></g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="54" y="58" fill="#dbeaf0" font-size="23" letter-spacing="6">HERMES</text>
    <text x="54" y="87" fill="#7f9898" font-size="15" letter-spacing="4">LOCAL OPERATOR</text>
    <text x="54" y="714" fill="#78938f" font-size="13" letter-spacing="2">SYNTHETIC PREVIEW · NO PRODUCTION DATA</text>
  </g>
  <g transform="translate(48 138)">
    <rect width="482" height="514" rx="18" fill="#071118" stroke="#35525f" stroke-width="2"/>
    <text x="28" y="42" fill="#819da5" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">LANDSCAPE AMBIENT VIEW</text>
    <text x="28" y="79" fill="#efd196" font-family="system-ui, sans-serif" font-size="27" font-weight="700">ATTENTION</text>
    <text x="28" y="109" fill="#d9e6e7" font-family="system-ui, sans-serif" font-size="16">Scheduler watch: Improve Hermes Display Screen</text>
    <circle cx="241" cy="261" r="104" fill="none" stroke="#6180c6" stroke-opacity=".30"/>
    <circle cx="241" cy="261" r="68" fill="#061016" stroke="#8ba1db" stroke-opacity=".58"/>
    <ellipse cx="241" cy="261" rx="30" ry="20" fill="#02060a" stroke="#d3b16f" stroke-width="2"/>
    <circle cx="246" cy="257" r="8" fill="#83a7ff" filter="url(#glow)" opacity=".9"/>
    <rect x="28" y="394" width="426" height="76" rx="8" fill="url(#amber)" stroke="#9b8050"/>
    <rect x="28" y="394" width="4" height="76" rx="2" fill="#d4b477"/>
    <text x="48" y="425" fill="#f2d49b" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="2">SCHEDULER ALERT</text>
    <text x="48" y="452" fill="#d7c6a7" font-family="system-ui, sans-serif" font-size="15">1 cron alert · tap Tasks for evidence</text>
  </g>
  <g transform="translate(562 82)">
    <rect width="590" height="570" rx="18" fill="#08121a" stroke="#395765" stroke-width="2"/>
    <text x="28" y="40" fill="#8ca6ac" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">SCHEDULER INCIDENTS · READ-ONLY</text>
    <text x="28" y="75" fill="#edf7fa" font-family="system-ui, sans-serif" font-size="25" font-weight="650">1 recent · 2 open</text>
    <text x="28" y="102" fill="#8fa8ad" font-family="system-ui, sans-serif" font-size="14">Durable, profile-scoped incident evidence</text>
    <g transform="translate(28 132)">
      <rect width="534" height="220" rx="9" fill="url(#amber)" stroke="#9b8050"/>
      <rect width="4" height="220" rx="2" fill="#d4b477"/>
      <text x="22" y="34" fill="#f2d49b" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1.8">IMPROVE HERMES DISPLAY SCREEN</text>
      <text x="22" y="67" fill="#f1e2c5" font-family="system-ui, sans-serif" font-size="17">Provider unavailable · alerted · 2m ago</text>
      <text x="22" y="99" fill="#afc1c6" font-family="ui-monospace, monospace" font-size="12">Profile silver · job display-nightly</text>
      <text x="22" y="130" fill="#d2dfe0" font-family="system-ui, sans-serif" font-size="14">Connection closed before the request was admitted.</text>
      <text x="22" y="160" fill="#91a9ae" font-family="ui-monospace, monospace" font-size="11">/home/brian/.hermes/cron/output/display-nightly/run.md</text>
      <text x="22" y="195" fill="#d3b879" font-family="system-ui, sans-serif" font-size="13">No retry, replay, acknowledge, or ownership claim.</text>
    </g>
    <text x="28" y="399" fill="#9bb2b8" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1.5">BEHAVIOR</text>
    <text x="28" y="431" fill="#d8e6e8" font-family="system-ui, sans-serif" font-size="14">Recent failures gently wake the eye and turn the idle rail amber.</text>
    <text x="28" y="458" fill="#d8e6e8" font-family="system-ui, sans-serif" font-size="14">Active work still wins the main activity card.</text>
    <text x="28" y="485" fill="#d8e6e8" font-family="system-ui, sans-serif" font-size="14">Older unresolved incidents remain inspectable without ambient alarm.</text>
    <line x1="28" y1="515" x2="562" y2="515" stroke="#29414c"/>
    <text x="28" y="546" fill="#819da5" font-family="system-ui, sans-serif" font-size="13">Credentials are redacted; useful private-home paths remain visible.</text>
  </g>
</svg>
