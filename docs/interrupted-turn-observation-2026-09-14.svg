<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic Hermes interrupted-turn observation preview</title>
  <desc id="desc">The private operator inspector shows an amber, non-error card after Hermes reports that a running turn was interrupted.</desc>
  <defs>
    <radialGradient id="bg" cx="42%" cy="43%" r="76%"><stop stop-color="#102431"/><stop offset="1" stop-color="#020609"/></radialGradient>
    <linearGradient id="interrupt" x1="0" x2="1"><stop stop-color="#2d2619"/><stop offset="1" stop-color="#181d20"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <g opacity=".52" fill="#64b7dc"><circle cx="88" cy="116" r="3"/><circle cx="1088" cy="122" r="4"/><circle cx="1036" cy="664" r="3"/><circle cx="136" cy="616" r="3"/><circle cx="278" cy="176" r="2.5"/></g>
  <circle cx="180" cy="382" r="94" fill="none" stroke="#6687d0" stroke-opacity=".32"/>
  <circle cx="180" cy="382" r="66" fill="#061016" stroke="#8aa0db" stroke-opacity=".55"/>
  <circle cx="180" cy="382" r="23" fill="#02060a" stroke="#c0a371"/>
  <circle cx="180" cy="382" r="7" fill="#83a7ff" filter="url(#glow)" opacity=".8"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="58" y="62" fill="#dbeaf0" font-size="23" letter-spacing="6">HERMES</text>
    <text x="58" y="91" fill="#7f9898" font-size="15" letter-spacing="4">LOCAL OPERATOR</text>
    <text x="58" y="708" fill="#78938f" font-size="13" letter-spacing="2">SYNTHETIC PREVIEW · NO PRODUCTION DATA</text>
  </g>
  <g transform="translate(350 48)">
    <rect width="790" height="664" rx="18" fill="#08121a" stroke="#395765" stroke-width="2"/>
    <text x="34" y="44" fill="#8ca6ac" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2">HERMES CONNECTION</text>
    <text x="34" y="81" fill="#edf7fa" font-family="system-ui, sans-serif" font-size="28" font-weight="650">Sessions &amp; automation</text>
    <text x="34" y="109" fill="#8fa8ad" font-family="system-ui, sans-serif" font-size="15">Exact owner-scoped lifecycle observation</text>
    <rect x="34" y="136" width="722" height="85" rx="8" fill="#152a37"/>
    <rect x="34" y="136" width="4" height="85" rx="2" fill="#79bcd5"/>
    <text x="56" y="172" fill="#e0f1f6" font-family="system-ui, sans-serif" font-size="21" font-weight="650">Turn interrupted</text>
    <text x="56" y="201" fill="#9eb3c2" font-family="ui-monospace, monospace" font-size="13">Turn: interrupted · Processes: 0 · Delegation units: 0 · Subagents: 0</text>
    <g transform="translate(34 250)">
      <rect width="722" height="152" rx="9" fill="url(#interrupt)" stroke="#9b8050"/>
      <rect width="4" height="152" rx="2" fill="#d4b477"/>
      <text x="24" y="36" fill="#f2d49b" font-family="ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="2">TURN INTERRUPTED</text>
      <text x="24" y="77" fill="#f2e4c8" font-family="system-ui, sans-serif" font-size="20" font-weight="620">Stopped by user request</text>
      <text x="24" y="112" fill="#cfbea0" font-family="ui-monospace, monospace" font-size="13">Surface tui · Reason session_interrupt</text>
    </g>
    <text x="34" y="449" fill="#9bb2b8" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1.5">WHY AMBER?</text>
    <text x="34" y="484" fill="#d8e6e8" font-family="system-ui, sans-serif" font-size="16">A deliberate stop is not rendered as a failed operation.</text>
    <text x="34" y="515" fill="#d8e6e8" font-family="system-ui, sans-serif" font-size="16">Background work remains independently active until its own evidence settles.</text>
    <line x1="34" y1="554" x2="756" y2="554" stroke="#29414c"/>
    <text x="34" y="592" fill="#819da5" font-family="system-ui, sans-serif" font-size="14">The card comes from Hermes agent_loop_stopped, not inferred log prose.</text>
    <text x="34" y="621" fill="#819da5" font-family="system-ui, sans-serif" font-size="14">No attach, retry, replay, or expanded control authority is introduced.</text>
  </g>
</svg>
