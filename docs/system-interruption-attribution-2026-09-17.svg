<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">System interruption attribution preview</title>
  <desc id="desc">Synthetic Hermes home display showing a smaller blue eye, blue motes, and a touch-readable card attributing an interrupted turn to the turn liveness watchdog.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="43%" r="66%">
      <stop offset="0" stop-color="#15232e"/>
      <stop offset=".45" stop-color="#080e14"/>
      <stop offset="1" stop-color="#030609"/>
    </radialGradient>
    <radialGradient id="iris" cx="45%" cy="42%" r="58%">
      <stop offset="0" stop-color="#05080d"/>
      <stop offset=".33" stop-color="#9db2ee"/>
      <stop offset=".68" stop-color="#315d88"/>
      <stop offset="1" stop-color="#06121a"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#181f29" stop-opacity=".98"/>
      <stop offset="1" stop-color="#091016" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="alert" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#361b22"/>
      <stop offset="1" stop-color="#181d20"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <path d="M78 122h250M872 122h250" stroke="#8ea7d5" stroke-opacity=".17"/>
  <text x="78" y="92" fill="#a6b4dc" font-family="ui-monospace,monospace" font-size="18" letter-spacing="4">AUGURY · ACTIVITY</text>
  <text x="872" y="92" fill="#a6b4dc" font-family="ui-monospace,monospace" font-size="18" letter-spacing="4">ROUTE · PROVIDERS</text>
  <text x="78" y="156" fill="#7e929e" font-family="ui-monospace,monospace" font-size="12" letter-spacing="2">SYSTEM INTERRUPTION OBSERVED</text>
  <text x="78" y="190" fill="#c9d4dc" font-family="system-ui,sans-serif" font-size="19">Turn stopped without a user request.</text>
  <text x="872" y="159" fill="#91a8e8" font-family="ui-monospace,monospace" font-size="17" letter-spacing="2">CHATGPT</text>
  <text x="1098" y="159" fill="#91a8e8" font-family="ui-monospace,monospace" font-size="17" text-anchor="end">READY</text>
  <text x="872" y="206" fill="#8192c6" font-family="ui-monospace,monospace" font-size="17" letter-spacing="2">CLAUDE</text>
  <text x="1098" y="206" fill="#8192c6" font-family="ui-monospace,monospace" font-size="17" text-anchor="end">READY</text>

