  <circle cx="560" cy="309" r="6" fill="#eef5ff" opacity=".72"/>
  <circle cx="587" cy="337" r="3" fill="#eef5ff" opacity=".52"/>
  <g fill="#77badd">
    <circle cx="414" cy="249" r="4"/><circle cx="723" cy="225" r="3"/><circle cx="752" cy="362" r="4"/><circle cx="443" cy="415" r="3"/><circle cx="630" cy="474" r="4"/>
  </g>

  <rect x="319" y="475" width="584" height="236" rx="18" fill="url(#panel)" stroke="#657887" stroke-opacity=".65"/>
  <text x="354" y="511" fill="#9bb4c7" font-family="ui-monospace,monospace" font-size="12" letter-spacing="2">OBSERVED PROFILE · FRESH</text>
  <text x="354" y="540" fill="#d8e4ec" font-family="ui-monospace,monospace" font-size="15">Turn interrupted · background work tracked independently</text>
  <rect x="354" y="561" width="514" height="117" rx="8" fill="url(#alert)" stroke="#9d5f68"/>
