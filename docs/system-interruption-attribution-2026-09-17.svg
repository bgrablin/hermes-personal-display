  <text x="376" y="623" fill="#ffe0e5" font-family="system-ui,sans-serif" font-size="22">Stopped by Hermes</text>
  <text x="376" y="652" fill="#e2aeb7" font-family="ui-monospace,monospace" font-size="12">CAUSE TURN LIVENESS WATCHDOG · DURING PROVIDER REQUEST · SURFACE GATEWAY</text>

  <line x1="0" y1="741" x2="1200" y2="741" stroke="#6e8291" stroke-opacity=".24"/>
  <circle cx="84" cy="770" r="5" fill="#ed8292"/>
  <text x="100" y="776" fill="#c8d2da" font-family="ui-monospace,monospace" font-size="15" letter-spacing="2">ATTENTION · HERMES STOPPED THIS TURN</text>
  <text x="1120" y="776" fill="#6d7d86" font-family="ui-monospace,monospace" font-size="11" text-anchor="end" letter-spacing="2">SYNTHETIC PREVIEW · NO CONTROL</text>
