  <circle cx="574" cy="324" r="126" fill="#03080d" stroke="#7689be" stroke-opacity=".38" stroke-width="2"/>
  <circle cx="574" cy="324" r="99" fill="url(#iris)" stroke="#a4b4e2" stroke-opacity=".6"/>
  <g stroke="#e1b879" stroke-opacity=".52" stroke-width="1">
    <path d="M574 230v54M609 236l-20 52M642 257l-42 40M663 290l-58 21M666 328l-62-3M654 365l-54-26M629 395l-42-45M593 415l-10-58M555 416l12-59M519 399l38-48M492 369l58-31M480 332l67-7M486 294l63 18M506 261l48 37M537 239l28 48"/>
