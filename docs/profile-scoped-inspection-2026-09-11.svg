<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic Hermes profile-scoped inspection preview</title>
  <desc id="desc">A dark Hermes operator screen with a provider route rail and a profile-qualified session identity card.</desc>
  <defs>
    <radialGradient id="bg" cx="42%" cy="45%" r="76%"><stop stop-color="#102431"/><stop offset="1" stop-color="#020609"/></radialGradient>
    <linearGradient id="card" x1="0" x2="1"><stop stop-color="#102735"/><stop offset="1" stop-color="#0c1822"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <g opacity=".5" fill="#64b7dc"><circle cx="95" cy="108" r="3"/><circle cx="1100" cy="120" r="4"/><circle cx="1045" cy="668" r="3"/><circle cx="140" cy="620" r="3"/></g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="58" y="62" fill="#dbeaf0" font-size="23" letter-spacing="6">HERMES</text>
    <text x="58" y="91" fill="#7f9898" font-size="15" letter-spacing="4">LOCAL OPERATOR</text>
    <text x="58" y="150" fill="#9aa8dc" font-size="15" letter-spacing="3">ROUTE · PROVIDERS</text>
    <g transform="translate(58 184)">
      <text y="0" fill="#aebbe8" font-size="16">✦ CHATGPT</text><text x="195" y="0" fill="#aebbe8" font-size="16">72%</text>
      <line x1="244" x2="330" stroke="#8197e8" stroke-width="3"/><circle cx="330" r="5" fill="#8197e8"/>
      <text y="68" fill="#9bb0e4" font-size="16">✧ CLAUDE</text><text x="195" y="68" fill="#9bb0e4" font-size="16">84%</text>
      <line x1="244" y1="68" x2="330" y2="68" stroke="#8197e8" stroke-width="3"/><circle cx="330" cy="68" r="5" fill="#8197e8"/>
      <text y="136" fill="#8798ca" font-size="16">✺ GEMINI</text><text x="195" y="136" fill="#8798ca" font-size="16">READY</text>
      <line x1="244" y1="136" x2="330" y2="136" stroke="#667bbd" stroke-width="2"/><circle cx="330" cy="136" r="5" fill="#667bbd"/>
    </g>
    <text x="58" y="708" fill="#78938f" font-size="13" letter-spacing="2">SYNTHETIC PREVIEW · NO PRODUCTION DATA</text>
  </g>
  <circle cx="218" cy="497" r="90" fill="none" stroke="#6687d0" stroke-opacity=".32"/>
  <circle cx="218" cy="497" r="62" fill="#061016" stroke="#8aa0db" stroke-opacity=".55"/>
  <circle cx="218" cy="497" r="22" fill="#02060a" stroke="#c0a371"/>
  <circle cx="218" cy="497" r="7" fill="#83a7ff" filter="url(#glow)" opacity=".8"/>
  <g transform="translate(465 44)">
    <rect width="675" height="672" rx="18" fill="#08121a" stroke="#395765" stroke-width="2"/>
    <text x="30" y="44" fill="#8ca6ac" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2">HERMES CONNECTION</text>
    <text x="30" y="82" fill="#edf7fa" font-family="system-ui, sans-serif" font-size="28" font-weight="650">Sessions &amp; automation</text>
    <text x="30" y="111" fill="#8fa8ad" font-family="system-ui, sans-serif" font-size="15">Select an exact profile and session before interpreting state.</text>
    <rect x="30" y="139" width="615" height="58" rx="7" fill="#101b28" stroke="#557080"/>
    <text x="49" y="175" fill="#d8e9f8" font-family="ui-monospace, monospace" font-size="15">.hermes / parent · observed · 8f12d9a4</text>
    <g transform="translate(30 220)">
      <rect width="615" height="134" rx="8" fill="url(#card)" stroke="#35566c"/>
      <rect width="4" height="134" rx="2" fill="#79bcd5"/>
      <text x="22" y="34" fill="#a9d8ea" font-family="ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="2">OBSERVED PROFILE</text>
      <text x="22" y="72" fill="#e0f1f6" font-family="system-ui, sans-serif" font-size="18">Profile /home/operator/.hermes</text>
      <text x="22" y="104" fill="#9eb3c2" font-family="ui-monospace, monospace" font-size="13">Session parent · observer 8f12d9a4c531…</text>
    </g>
    <g transform="translate(30 379)">
      <rect width="615" height="93" rx="8" fill="#152a37"/>
      <rect width="4" height="93" rx="2" fill="#79bcd5"/>
      <text x="22" y="38" fill="#e0f1f6" font-family="system-ui, sans-serif" font-size="20" font-weight="620">1 background command continuing</text>
      <text x="22" y="68" fill="#8faab3" font-family="ui-monospace, monospace" font-size="13">Turn: completed · Processes: 1 · Delegation units: 0</text>
    </g>
    <line x1="30" y1="505" x2="645" y2="505" stroke="#29414c"/>
    <text x="30" y="545" fill="#9bb2b8" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1.5">WHY SHOW THE PROFILE?</text>
    <text x="30" y="580" fill="#d8e6e8" font-family="system-ui, sans-serif" font-size="16">Runtime session IDs can repeat across profile homes.</text>
    <text x="30" y="611" fill="#819da5" font-family="system-ui, sans-serif" font-size="14">Full owner identity remains visible in this private operator view.</text>
    <text x="30" y="640" fill="#819da5" font-family="system-ui, sans-serif" font-size="14">No session attach, replay, or new control authority is implied.</text>
  </g>
</svg>
