[Service]
# Accepted MINIX/SF10T kiosk baseline for the Intel NUC.
# Conservative no-visible-change Chromium flags: preserve FPS, refresh rate,
# resolution, DP-2 inversion, and display effects while reducing sustained heat.
Environment="PERSONAL_DISPLAY_CHROME_ARGS=--touch-events=enabled --enable-features=OverlayScrollbar --disable-background-networking --disable-sync --disable-renderer-backgrounding --disable-background-timer-throttling --force-device-scale-factor=1 --enable-gpu-rasterization --enable-zero-copy --enable-oop-rasterization --ignore-gpu-blocklist --no-default-browser-check --disable-default-apps --disable-component-update --disable-domain-reliability"
