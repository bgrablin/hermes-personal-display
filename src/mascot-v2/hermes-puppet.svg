<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" role="img" aria-labelledby="title desc">
  <title id="title">Hermes mascot v3 retro robot face puppet</title>
  <desc id="desc">A cute retro AI robot head inspired by classic robots, built from a simple screen face with expressive eyes and mouth. No cheek badge, no teeth, no eyebrows.</desc>
  <defs>
    <linearGradient id="shellFill" x1="40" y1="30" x2="180" y2="218" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eefcff"/>
      <stop offset="0.34" stop-color="#8eeeff"/>
      <stop offset="1" stop-color="#294763"/>
    </linearGradient>
    <linearGradient id="screenFill" x1="48" y1="76" x2="172" y2="162" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#102844"/>
    </linearGradient>
    <linearGradient id="v2HelmetFill" x1="36" x2="184" y1="31" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#25334d" />
      <stop offset="0.58" stop-color="#10192a" />
      <stop offset="1" stop-color="#070b13" />
    </linearGradient>
    <linearGradient id="v2Gold" x1="72" x2="150" y1="34" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a3" />
      <stop offset="1" stop-color="#b98537" />
    </linearGradient>
    <filter id="v2SoftGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="screenGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="puppet" class="puppet" transform="translate(110 127)">
    <ellipse id="aura" class="aura" cx="0" cy="18" rx="82" ry="92" fill="#65f3ff" opacity="0.13" filter="url(#v2SoftGlow)" />

    <g id="tail" class="tail">
      <path id="tail-main" d="M-30 66 C-44 96 -30 123 -5 126 C25 129 42 101 28 68 C18 85 8 93 -4 93 C-18 93 -26 82 -30 66Z" fill="url(#shellFill)" opacity="0.88" />
      <path id="tail-highlight" d="M-10 78 C-13 94 -4 106 11 101" fill="none" stroke="#f5fdff" stroke-width="4" stroke-linecap="round" opacity="0.25" />
    </g>

    <g id="body" class="body">
      <path id="body-main" d="M-67 -12 C-67 -55 -38 -84 0 -84 C39 -84 68 -55 68 -12 L68 38 C68 68 44 86 0 86 C-44 86 -68 68 -68 38Z" fill="url(#shellFill)" stroke="#d9fbff" stroke-width="2" />
      <path id="body-shadow" d="M-54 45 C-31 66 27 69 55 35 C46 70 18 84 -18 78 C-42 74 -56 62 -54 45Z" fill="#13263f" opacity="0.18" />
      <rect id="faceplate" x="-51" y="-39" width="102" height="87" rx="23" fill="url(#screenFill)" stroke="#9ef6ff" stroke-width="2.3" filter="url(#screenGlow)" />
      <path id="screen-shine" d="M-36 -28 C-15 -38 17 -38 38 -24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.12" />
      <path id="chin-line" d="M-32 61 C-10 70 17 70 36 59" fill="none" stroke="#9ef6ff" stroke-width="2" stroke-linecap="round" opacity="0.22" />
    </g>

    <g id="helmet" class="helmet">
      <path id="helmet-back" d="M-69 -61 C-40 -93 39 -93 69 -61 C39 -71 -39 -71 -69 -61Z" fill="#070b13" opacity="0.58" />
      <path id="wing-left" d="M-51 -68 C-83 -96 -99 -73 -89 -53 C-106 -61 -109 -31 -74 -29 C-79 -41 -76 -52 -63 -56 C-69 -61 -63 -67 -51 -68Z" fill="#eaf9ff" stroke="#25334d" stroke-width="3" stroke-linejoin="round" />
      <path id="wing-right" d="M51 -68 C83 -96 99 -73 89 -53 C106 -61 109 -31 74 -29 C79 -41 76 -52 63 -56 C69 -61 63 -67 51 -68Z" fill="#eaf9ff" stroke="#25334d" stroke-width="3" stroke-linejoin="round" />
      <path id="wing-left-line" d="M-88 -73 C-78 -66 -69 -56 -62 -43 M-94 -58 C-82 -55 -73 -49 -67 -39 M-81 -86 C-74 -76 -69 -66 -66 -55" fill="none" stroke="#91a4b3" stroke-width="1.8" stroke-linecap="round" opacity="0.58" />
      <path id="wing-right-line" d="M88 -73 C78 -66 69 -56 62 -43 M94 -58 C82 -55 73 -49 67 -39 M81 -86 C74 -76 69 -66 66 -55" fill="none" stroke="#91a4b3" stroke-width="1.8" stroke-linecap="round" opacity="0.58" />
      <path id="helmet-dome" d="M-64 -48 C-38 -91 39 -91 66 -48 C39 -35 -38 -35 -64 -48Z" fill="url(#v2HelmetFill)" stroke="#41516d" stroke-width="2" />
      <path id="helmet-band" d="M-70 -44 C-36 -29 37 -29 71 -44 L67 -31 C34 -18 -34 -18 -66 -31Z" fill="url(#v2Gold)" stroke="#5d4121" stroke-width="1.6" />
      <path id="helmet-band-shine" d="M-42 -40 C-24 -35 14 -35 38 -40" fill="none" stroke="#fff3c7" stroke-width="1.3" stroke-linecap="round" opacity="0.26" />
      <path id="helmet-ridge" d="M-4 -85 C8 -77 14 -63 13 -38 C5 -35 -5 -35 -13 -38 C-14 -62 -10 -77 -4 -85Z" fill="url(#v2Gold)" stroke="#5d4121" stroke-width="1.5" />
      <path id="helmet-ridge-shine" d="M-4 -76 C0 -68 2 -58 1 -45" fill="none" stroke="#fff9df" stroke-width="1.1" stroke-linecap="round" opacity="0.24" />
    </g>

    <g id="face" class="face" transform="translate(0 -3)">
      <g id="eye-left" class="eye" transform="translate(-24 0)">
        <ellipse class="eye-glow" cx="0" cy="0" rx="24" ry="16" fill="#65f3ff" opacity="0.28" filter="url(#v2SoftGlow)" />
        <ellipse class="eye-white" cx="0" cy="0" rx="17" ry="10" fill="#16334f" />
        <circle class="iris" cx="0" cy="0" r="7.8" fill="#65f3ff" />
        <circle class="pupil" cx="0" cy="0" r="3.6" fill="#f9feff" />
        <circle class="catchlight" cx="-3" cy="-3" r="1.35" fill="#ffffff" opacity="0.82" />
        <path class="upper-lid" d="M-23 -15 Q0 -7 23 -15 L23 -31 L-23 -31Z" fill="#102844" opacity="0.96" />
        <path class="lower-lid" d="M-23 15 Q0 8 23 15 L23 28 L-23 28Z" fill="#102844" opacity="0.88" />
        <path class="brow" d="M-16 -17 Q0 -18 16 -17" fill="none" stroke="#65f3ff" stroke-width="1.3" stroke-linecap="round" opacity="0.04" />
      </g>
      <g id="eye-right" class="eye" transform="translate(24 0)">
        <ellipse class="eye-glow" cx="0" cy="0" rx="24" ry="16" fill="#65f3ff" opacity="0.28" filter="url(#v2SoftGlow)" />
        <ellipse class="eye-white" cx="0" cy="0" rx="17" ry="10" fill="#16334f" />
        <circle class="iris" cx="0" cy="0" r="7.8" fill="#65f3ff" />
        <circle class="pupil" cx="0" cy="0" r="3.6" fill="#f9feff" />
        <circle class="catchlight" cx="-3" cy="-3" r="1.35" fill="#ffffff" opacity="0.82" />
        <path class="upper-lid" d="M-23 -15 Q0 -7 23 -15 L23 -31 L-23 -31Z" fill="#102844" opacity="0.96" />
        <path class="lower-lid" d="M-23 15 Q0 8 23 15 L23 28 L-23 28Z" fill="#102844" opacity="0.88" />
        <path class="brow" d="M-16 -17 Q0 -18 16 -17" fill="none" stroke="#65f3ff" stroke-width="1.3" stroke-linecap="round" opacity="0.04" />
      </g>
      <path id="mouth-fill" class="mouth-fill" d="M-18 31 Q 0 38 18 31" fill="#65f3ff" opacity="0" />
      <path id="mouth" class="mouth" d="M-18 31 Q 0 38 18 31" fill="none" stroke="#65f3ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <path id="mouth-glow" d="M-18 31 Q 0 38 18 31" fill="none" stroke="#f9feff" stroke-width="1.2" stroke-linecap="round" opacity="0.45" />
    </g>

    <g id="runes" class="runes" fill="none" stroke-linecap="round">
      <path id="rune-a" d="M-13 -55 C-2 -45 -2 -29 -14 -18" stroke="#ffffff" stroke-width="1.4" opacity="0.10" />
      <path id="rune-b" d="M19 -55 C8 -38 14 -23 31 -18" stroke="#b899ff" stroke-width="1.4" opacity="0.13" />
      <path id="scan-beam" d="M-38 -17 H38" stroke="#65f3ff" stroke-width="2.2" opacity="0" />
    </g>
  </g>
</svg>
