name: Publication safety

on:
  # This job runs trusted base-branch code. It fetches the PR object only and
  # never checks out or executes code from the untrusted pull request.
  pull_request_target:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  publication-safety:
    name: Publication safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # pull_request_target checks out the target base revision by default.
      # Do not change this to the PR ref or execute files from the PR object.
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run private-detail detector canaries
        run: python3 scripts/publication_safety.py --self-test

      - name: Install verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.29.1
          GITLEAKS_SHA256: e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" > "$RUNNER_TEMP/gitleaks.sha256"
          sha256sum --check --strict "$RUNNER_TEMP/gitleaks.sha256"
          tar --extract --file="$archive" --directory="$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks" version

      - name: Verify Gitleaks canaries
        run: python3 scripts/publication_safety.py --gitleaks-self-test "$RUNNER_TEMP/gitleaks"

      - name: Scan trusted publication range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          full_sha='^[0-9a-fA-F]{40,64}$'
          validate_sha() {
            [[ "$1" =~ $full_sha ]]
            git cat-file -e "$1^{commit}"
          }

          trusted_ignore="$RUNNER_TEMP/trusted.gitleaksignore"
          candidate_ignore="$RUNNER_TEMP/candidate.gitleaksignore"
          : > "$trusted_ignore"
          : > "$candidate_ignore"
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
            base="$PR_BASE"
            head="$PR_HEAD"
            validate_sha "$base"
            [[ "$head" =~ $full_sha ]]
            fetch_log="$RUNNER_TEMP/pr-fetch.log"
            git fetch --no-tags --force --quiet origin "refs/pull/${PR_NUMBER}/head" >"$fetch_log" 2>&1
            fetched="$(git rev-parse FETCH_HEAD^{commit})"
            [[ "$fetched" == "$head" ]]
            if git cat-file -e "$base:.gitleaksignore"; then
              git show "$base:.gitleaksignore" > "$trusted_ignore"
            fi
            if git cat-file -e "$head:.gitleaksignore"; then
              git show "$head:.gitleaksignore" > "$candidate_ignore"
            fi
            python3 scripts/publication_safety.py --base "$base" --head "$head" \
              --trusted-gitleaks-ignore "$trusted_ignore" \
              --candidate-gitleaks-ignore "$candidate_ignore"
            log_opts="$base..$head"
          elif [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            head="$PUSH_AFTER"
            validate_sha "$head"
            python3 scripts/publication_safety.py --head "$head" --root \
              --trusted-gitleaks-ignore "$trusted_ignore"
            log_opts="$head"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$PUSH_BEFORE"
            head="$PUSH_AFTER"
            validate_sha "$base"
            validate_sha "$head"
            if git cat-file -e "$base:.gitleaksignore"; then
              git show "$base:.gitleaksignore" > "$trusted_ignore"
            fi
            if git cat-file -e "$head:.gitleaksignore"; then
              git show "$head:.gitleaksignore" > "$candidate_ignore"
            fi
            python3 scripts/publication_safety.py --base "$base" --head "$head" \
              --trusted-gitleaks-ignore "$trusted_ignore" \
              --candidate-gitleaks-ignore "$candidate_ignore" \
              --allow-historical-gitleaks-ignore-additions --trusted-base "$base"
            log_opts="$base..$head"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "schedule" ]]; then
            head="$(git rev-parse HEAD^{commit})"
            validate_sha "$head"
            if git cat-file -e "$head:.gitleaksignore"; then
              git show "$head:.gitleaksignore" > "$trusted_ignore"
            fi
            python3 scripts/publication_safety.py --self-test
            log_opts="$head"
          else
            echo "FAIL unsupported publication-safety event" >&2
            exit 2
          fi

          # Enforce a clean complete candidate tree in addition to the commit
          # delta. The trusted checker reads the candidate object but never
          # checks out or executes candidate code.
          python3 scripts/publication_safety.py --tree-ref "$head"

          report="$RUNNER_TEMP/gitleaks.json"
          set +e
          gitleaks git --log-opts="$log_opts" --redact --ignore-gitleaks-allow \
            --gitleaks-ignore-path "$trusted_ignore" --no-banner --no-color \
            --report-format json --report-path "$report" --exit-code 1 \
            >"$RUNNER_TEMP/gitleaks.stdout" 2>"$RUNNER_TEMP/gitleaks.stderr"
          status=$?
          set -e
          python3 scripts/publication_safety.py --gitleaks-report "$report" --gitleaks-status "$status"