name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Check generated display contract is current
        run: |
          python3 scripts/generate_display_contract.py
          git diff --exit-code -- src/generated/display-contract.js scripts/generated/display_contract.py

      - name: Check generated build id is current
        run: npm run check:build-id

      - name: Run non-Playwright test gate
        run: npm test
